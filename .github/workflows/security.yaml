        run: |
          mkdir -p _gate
          printf '%s' "$SECURITY_GATE_B64" | tr -d '\n ' | base64 -d > _gate/security_gate.py
          printf '%s' "$ALLOWLIST_COMMON_B64" | tr -d '\n ' | base64 -d > _gate/_allowlist_common.py
          echo "pyyaml>=6.0" > _gate/requirements.txt

      - name: Run security gate (warn mode)
        env:
          ENV: ${{ steps.env.outputs.env }}
          # Thread detect's AUTO-DETECTED (pre-override) stack outputs so the
          # gate can distinguish a detect-skipped surface (expected-absent ->
          # skipped) from a broken scanner (missing -> fail-closed). We pass the
          # *_detected values, not the post-override has_*: a .security-config
          # opt-out still skips running the scanner, but must not let a missing
          # artifact pass as 'skipped'.
          HAS_IAC: ${{ needs.detect.outputs.has_iac_detected }}
          HAS_DOCKERFILE: ${{ needs.detect.outputs.has_dockerfile_detected }}
          HAS_LICENSE_DEPS: ${{ needs.detect.outputs.has_license_deps_detected }}
        run: |
          python3 -m pip install --quiet -r _gate/requirements.txt
          python3 _gate/security_gate.py \
            --mode warn \
            --env "$ENV" \
            --posture rollout \
            --allowlist .security-allowlist.yaml \
            --results-dir scan-artifacts \
            --has-iac "$HAS_IAC" \
            --has-dockerfile "$HAS_DOCKERFILE" \
            --has-license-deps "$HAS_LICENSE_DEPS" \
            > gate-summary.json
          # Echo the verdict for log readability without re-running the script.
          cat gate-summary.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-summary
          path: gate-summary.json
