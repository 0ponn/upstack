# Security Pipeline — STANDALONE COPY for public repos.
#
# This repo is PUBLIC and GitHub forbids public repos from calling reusable
# workflows that live in a private repo (0ponn/devsec-baseline). The thin
# `workflow_call` caller therefore startup-fails here with zero jobs. This
# file is a verbatim fork of devsec-baseline/.github/workflows/security.yaml
# with the `workflow_call` trigger dropped and every job name prefixed
# "security / " to match the check contexts the private-repo callers produce,
# so any future required-check promotion covers both shapes with one context.
#
# SYNC NOTE: changes to the canonical workflow in devsec-baseline must be
# hand-copied here (and to the other public forks). Tracked in SEC-9.

name: Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# --------------------------------------------------------------------------- #
#  Detect job — inspects repo contents and emits flags for downstream jobs     #
# --------------------------------------------------------------------------- #
jobs:
  detect:
    name: security / Detect stacks
    runs-on: ubuntu-latest
    outputs:
      has_python:     ${{ steps.detect.outputs.has_python }}
      has_node:       ${{ steps.detect.outputs.has_node }}
      has_go:         ${{ steps.detect.outputs.has_go }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
      has_iac:        ${{ steps.detect.outputs.has_iac }}
      has_license_deps: ${{ steps.detect.outputs.has_license_deps }}
      # Pre-override (auto-detected) applicability. These reflect what the repo
      # actually contains, BEFORE any .security-config.yaml opt-out is applied.
      # The gate consumes these (not the post-override has_* above) so a config
      # opt-out cannot launder a missing artifact into a passing 'skipped'.
      has_dockerfile_detected: ${{ steps.detect.outputs.has_dockerfile_detected }}
      has_iac_detected:        ${{ steps.detect.outputs.has_iac_detected }}
      has_license_deps_detected: ${{ steps.detect.outputs.has_license_deps_detected }}
      sast_rulesets:  ${{ steps.detect.outputs.sast_rulesets }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect stacks and apply overrides
        id: detect
        run: |
          # ── Auto-detection ──────────────────────────────────────────────
          has_python=false
          has_node=false
          has_go=false
          has_dockerfile=false
          has_iac=false

          # Python
          for f in requirements.txt pyproject.toml Pipfile.lock poetry.lock; do
            if [ -f "$f" ]; then has_python=true; break; fi
          done

          # Node.js
          for f in package-lock.json yarn.lock pnpm-lock.yaml; do
            if [ -f "$f" ]; then has_node=true; break; fi
          done

          # Go
          [ -f go.mod ] && has_go=true

          # Dockerfile (search recursively — Dockerfiles often live in subdirectories)
          if find . -maxdepth 3 -name 'Dockerfile*' -o -name 'Containerfile*' 2>/dev/null | grep -q .; then
            has_dockerfile=true
          fi

          # IaC
          # IaC — fast path: known directory names
          for d in terraform deploy k8s helm helm-values cluster resources templates manifests overlays base; do
            if [ -d "$d" ]; then has_iac=true; break; fi
          done
          if compgen -G "*.tf" >/dev/null 2>&1 || [ -f Chart.yaml ]; then
            has_iac=true
          fi
          if compgen -G "*values*.yaml" >/dev/null 2>&1; then
            has_iac=true
          fi
          # IaC — fallback: scan for Kubernetes manifests by content
          if [ "$has_iac" = "false" ]; then
            if grep -rl '^apiVersion:' --include='*.yaml' --include='*.yml' -m 1 . >/dev/null 2>&1; then
              has_iac=true
            fi
          fi

          # ── Snapshot auto-detected applicability (pre-override) ─────────
          # Captured before any .security-config.yaml opt-out runs, so the gate
          # can tell genuine absence (no surface -> may be 'skipped') from a
          # config opt-out (surface present, scan disabled -> stays 'missing').
          # (license is snapshotted below, after it is computed.)
          has_iac_detected=$has_iac
          has_dockerfile_detected=$has_dockerfile

          # ── Override processing ─────────────────────────────────────────
          CONFIG=".security-config.yaml"
          extra_rulesets=""

          if [ -f "$CONFIG" ]; then
            echo "Found $CONFIG — applying overrides"
            cat > /tmp/parse_overrides.py << 'PARSER'
          import sys, yaml
          config = yaml.safe_load(open(sys.argv[1]))
          overrides = (config or {}).get("overrides", {})
          # NOTE: keep in sync with the case arms in the bash reader below.
          for slot in ["iac", "dockerfile-linting", "license"]:
              val = overrides.get(slot)
              if val is False:
                  var = slot.replace("-", "_") + "_override"
                  print(f"{var}=false")
          sast = overrides.get("sast", {})
          if isinstance(sast, dict):
              extras = sast.get("extra_rulesets", [])
              if isinstance(extras, list) and extras:
                  # Ruleset ids are single tokens; strip embedded newlines so a
                  # crafted entry can't split into extra lines that the bash
                  # reader below would parse as separate, misinterpreted records.
                  cleaned = [str(e).replace("\n", " ").replace("\r", " ") for e in extras]
                  joined = " ".join(cleaned)
                  print(f"extra_rulesets={joined}")
              elif not isinstance(extras, list):
                  # stderr: stdout is a key=value wire protocol for the bash reader below.
                  print(f"extra_rulesets ignored: expected a list, got {type(extras).__name__}", file=sys.stderr)
          PARSER
            # Assign parser output as literal data — eval'ing it would let
            # arbitrary content from .security-config.yaml run as shell code.
            # NOTE: keep in sync with parse_overrides.py's slot list above.
            while IFS='=' read -r key value; do
              case "$key" in
                iac_override|dockerfile_linting_override|license_override|extra_rulesets)
                  declare "$key=$value"
                  ;;
                *)
                  echo "::warning::ignoring unrecognized override key from parser: $key"
                  ;;
              esac
            done < <(python3 /tmp/parse_overrides.py "$CONFIG")

            [ "${iac_override:-}" = "false" ] && has_iac=false
            [ "${dockerfile_linting_override:-}" = "false" ] && has_dockerfile=false
          fi

          # ── License deps flag (mirrors SCA condition) ──────────────────
          has_license_deps=false
          if [ "$has_python" = "true" ] || [ "$has_node" = "true" ] || [ "$has_go" = "true" ]; then
            has_license_deps=true
          fi
          # Pre-override snapshot (see note above); license depends only
          # on stack detection, never on an override, so capture it here.
          has_license_deps_detected=$has_license_deps
          [ "${license_override:-}" = "false" ] && has_license_deps=false

          # ── Build SAST rulesets ─────────────────────────────────────────
          rulesets="p/owasp-top-ten p/security-audit"

          if [ "$has_python" = "true" ]; then
            rulesets="$rulesets p/python"
          fi
          if [ "$has_node" = "true" ]; then
            rulesets="$rulesets p/javascript p/typescript p/nodejs"
          fi
          if [ "$has_go" = "true" ]; then
            rulesets="$rulesets p/golang"
          fi
          if [ -n "$extra_rulesets" ]; then
            rulesets="$rulesets $extra_rulesets"
          fi

          # ── Emit outputs ────────────────────────────────────────────────
          {
            echo "has_python=$has_python"
            echo "has_node=$has_node"
            echo "has_go=$has_go"
            echo "has_dockerfile=$has_dockerfile"
            echo "has_iac=$has_iac"
            echo "has_license_deps=$has_license_deps"
            echo "has_dockerfile_detected=$has_dockerfile_detected"
            echo "has_iac_detected=$has_iac_detected"
            echo "has_license_deps_detected=$has_license_deps_detected"
            echo "sast_rulesets=$rulesets"
          } >> "$GITHUB_OUTPUT"

          # ── Step summary ────────────────────────────────────────────────
          {
            echo "### Stack Detection Results"
            echo ""
            echo "| Signal | Detected |"
            echo "|--------|----------|"
            echo "| Python | $has_python |"
            echo "| Node.js | $has_node |"
            echo "| Go | $has_go |"
            echo "| Dockerfile | $has_dockerfile |"
            echo "| IaC | $has_iac |"
            echo "| License | $has_license_deps |"
            echo ""
            echo "**SAST rulesets:** \`$rulesets\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$CONFIG" ]; then
            {
              echo ""
              echo "_Overrides applied from .security-config.yaml_"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ----------------------------------------------------------------------- #
  #  SAST — Static Application Security Testing (semgrep)                    #
  # ----------------------------------------------------------------------- #
  sast:
    name: security / SAST (semgrep)
    needs: [detect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Install semgrep
        run: pipx install semgrep

      - name: Run SAST scan
        env:
          SAST_RULESETS: ${{ needs.detect.outputs.sast_rulesets }}
        run: |
          # Auto-detect languages + add stack-specific rulesets from detect job.
          # Rulesets come in via env:, not interpolated directly into this script,
          # so a crafted value can't inject shell code (word-splitting on
          # $SAST_RULESETS below is intentional — it's a space-separated list).
          CONFIGS=(--config auto)
          for ruleset in $SAST_RULESETS; do
            CONFIGS+=(--config "$ruleset")
          done
          semgrep scan "${CONFIGS[@]}" --sarif --output sast-results.sarif . || true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: sast-results.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-results
          path: sast-results.sarif

  # ----------------------------------------------------------------------- #
  #  SCA — Software Composition Analysis (trivy)                             #
  # ----------------------------------------------------------------------- #
  sca:
    name: security / SCA (trivy)
    needs: [detect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          skip-dirs: 3rdparty,vendor,node_modules,.venv,build
          format: json
          output: sca-results.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sca-results
          path: sca-results.json

  # ----------------------------------------------------------------------- #
  #  License Compliance (trivy) — warn only                                  #
  # ----------------------------------------------------------------------- #
  license:
    name: security / License Compliance (trivy)
    needs: [detect]
    if: needs.detect.outputs.has_license_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-dirs: 3rdparty,vendor,node_modules,.venv,build
          format: json
          output: license-results.json
          exit-code: "0"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: license-results
          path: license-results.json

  # ----------------------------------------------------------------------- #
  #  Secrets Detection (betterleaks) — always runs                           #
  # ----------------------------------------------------------------------- #
  secrets:
    name: security / Secrets Detection (betterleaks)
    needs: [detect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          # Pinned checksum: this pipeline runs in every consumer repo, so the
          # release asset must not be executed unverified.
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v1.1.1/betterleaks_1.1.1_linux_x64.tar.gz" -o /tmp/betterleaks.tar.gz
          echo "d590d5f051e49f6769c61dc8cebbce947b20a4042e2915ee234760f81a01c8c4  /tmp/betterleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/betterleaks.tar.gz -C /usr/local/bin betterleaks
          chmod +x /usr/local/bin/betterleaks

      - name: Scan for secrets (current state)
        run: |
          betterleaks dir . \
            --report-format sarif \
            --report-path secrets-results.sarif \
            --exit-code 0
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: secrets-results.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: secrets-results
          path: secrets-results.sarif

  # ----------------------------------------------------------------------- #
  #  IaC Scanning (trivy)                                                    #
  # ----------------------------------------------------------------------- #
  iac:
    name: security / IaC Scanning (trivy)
    needs: [detect]
    if: needs.detect.outputs.has_iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          format: json
          output: iac-results.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iac-results
          path: iac-results.json

  # ----------------------------------------------------------------------- #
  #  Dockerfile Linting (hadolint)                                           #
  # ----------------------------------------------------------------------- #
  dockerfile:
    name: security / Dockerfile Linting (hadolint)
    needs: [detect]
    if: needs.detect.outputs.has_dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # This job checks out the CALLER repo, not devsec-baseline, so usually no
      # .hadolint.yaml is on disk. Materialize the baseline config inline (same
      # pattern as the semgrep/trivy settings above) so hadolint's ignore list
      # (DL3008) applies. Precedence: a caller repo's own root .hadolint.yaml
      # wins; the baseline below is only a fallback for repos without one.
      - name: Materialize hadolint config if caller has none
        run: |
          test -f .hadolint.yaml || cat > .hadolint.yaml <<'EOF'
          failure-threshold: warning
          trustedRegistries:
            - "*.dkr.ecr.*.amazonaws.com"
            - "ghcr.io"
          ignored:
            - DL3008  # apt-get version pinning (handled per-service)
          EOF

      # Non-gating, like every other scanner here: emit SARIF and defer the
      # PASS/FAIL verdict to security_gate.py.
      #
      # Gating policy: removing the scanner-step hard-fail
      # only drops the JOB-level failure. hadolint's SARIF still flows into
      # security_gate.py, where the gate matrix — NOT this workflow — decides
      # blocking. Dockerfile-lint findings are warn-only in that gate
      # (dockerfile-linting is in WARN_ONLY_SLOTS). That scopes
      # findings only — a missing or unparseable SARIF still fails closed under
      # enforce. See "Warn-only slots" in gating/README.md for the exact scope.
      #
      # Driven directly instead of via hadolint-action's recursive mode: that
      # mode globs for exactly `**/Dockerfile` and silently misses the common
      # `Dockerfile.<suffix>` convention (Dockerfile.api, Dockerfile.prod, …),
      # passing an unexpanded glob to hadolint that errors and emits no SARIF —
      # which then fails the whole job. We reuse the SAME find as the detect job
      # so the lint set matches what flagged the repo, and always write valid
      # SARIF (even zero-findings) so the gate sees a clean scan, never a broken
      # one. `--no-fail` keeps lint findings from reddening the job; the gate
      # decides blocking (dockerfile-linting is warn-only).
      - name: Install hadolint
        run: |
          curl -sSL "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64" -o /tmp/hadolint
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint

      - name: Run hadolint
        run: |
          mapfile -t DFILES < <(find . -maxdepth 3 \( -name 'Dockerfile*' -o -name 'Containerfile*' \) -type f 2>/dev/null)
          if [ "${#DFILES[@]}" -eq 0 ]; then
            # detect said has_dockerfile=true, so this should not happen; if it
            # does, emit an empty-but-valid SARIF rather than nothing so the
            # gate reads a clean scan instead of a missing artifact.
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Hadolint","rules":[]}},"results":[]}]}' > hadolint.sarif
          else
            hadolint --no-fail --config .hadolint.yaml --format sarif "${DFILES[@]}" > hadolint.sarif
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dockerfile-results
          path: hadolint.sarif

  # ----------------------------------------------------------------------- #
  #  Security Gate (warn-only phase)                                         #
  #                                                                          #
  #  Aggregates scanner outputs, applies the per-repo allowlist, and emits   #
  #  a single PASS/FAIL verdict per the severity gating spec. Currently in   #
  #  warn-only mode: the verdict is observable in the step summary and       #
  #  uploaded artifact, but the job always exits 0 and never blocks merges.  #
  #  The flip from warn to enforce is tracked in SEC-5 and depends on a      #
  #  2-3 week calibration window against real PR traffic.                    #
  # ----------------------------------------------------------------------- #
  gate:
    name: security / Security Gate
    needs: [detect, sast, sca, secrets, iac, dockerfile, license]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Checks out the CALLER repo (consumer using this reusable workflow).
      # Provides access to .security-allowlist.yaml if the caller has one.
      - name: Checkout caller repo
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: scan-artifacts

      - name: Determine environment
        id: env
        env:
          # Indirection, not interpolation: a ref name can carry shell
          # metacharacters, so it must never be spliced into the script text.
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # env=main only on a push to the default branch (main or master).
          # Anything else (PRs, feature-branch pushes, workflow_dispatch from
          # a non-default branch) is feature.
          if [ "$EVENT_NAME" = "push" ] && \
             { [ "$REF" = "refs/heads/main" ] || \
               [ "$REF" = "refs/heads/master" ]; }; then
            echo "env=main" >> "$GITHUB_OUTPUT"
          else
            echo "env=feature" >> "$GITHUB_OUTPUT"
          fi

      # Materialize the gate script from the inline base64 blobs below.
      # devsec-baseline is private, the default GITHUB_TOKEN is scoped to the
      # caller repo, and there is no shared org PAT, so cross-repo checkout
      # is not viable. Instead the canonical Python files in gating/ are
      # embedded into this workflow at commit time. The drift between the
      # inline blobs and the canonical sources is enforced by the test
      # `test_inline_in_sync_with_canonical` in test_security_gate.py and
      # refreshed via `python3 gating/_inline_into_workflow.py update`.
      - name: Materialize gate script
        env:
          # >>> inline-begin (managed by gating/_inline_into_workflow.py)
          SECURITY_GATE_B64: |
            IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwoiIiJTZWN1cml0eSBnYXRlIGFnZ3JlZ2F0b3IgZm9yIHRo
