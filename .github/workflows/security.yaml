            UklGICsgdHJpdnkgSlNPTiksIG5vcm1hbGl6ZXMgc2V2ZXJpdGllcywKYXBwbGllcyB0aGUgcGVy
            LXJlcG8gYWxsb3dsaXN0IHdpdGggZXhwaXJ5IGVuZm9yY2VtZW50LCBldmFsdWF0ZXMgdGhlIGdh
            dGUKbWF0cml4IHBlciBlbnZpcm9ubWVudCBhbmQgcG9zdHVyZSwgYW5kIGVtaXRzIGEgSlNPTiB2
            ZXJkaWN0IHRvIHN0ZG91dCBwbHVzCmEgTWFya2Rvd24gc3RlcCBzdW1tYXJ5IHRvICRHSVRIVUJf
            U1RFUF9TVU1NQVJZLgoKTW9kZXM6CiAgd2FybiAoZGVmYXVsdCk6IGFsd2F5cyBleGl0cyAwLiBS
            ZXBvcnRzIHdoYXQgd291bGQgaGF2ZSBibG9ja2VkIHVuZGVyCiAgICBlbmZvcmNlIG1vZGUgd2l0
            aG91dCBmYWlsaW5nIENJLiBVc2VkIGR1cmluZyB0aGUgaW5pdGlhbCBjYWxpYnJhdGlvbgogICAg
            d2luZG93LgogIGVuZm9yY2U6IGV4aXRzIDAgPSBwYXNzLCAxID0gYmxvY2tlZCBieSBmaW5kaW5n
            cywgMiA9IHRvb2wgZXJyb3Igb3IKICAgIG1pc3NpbmcgYXJ0aWZhY3QgKGZhaWwtY2xvc2VkIHBl
            ciBzcGVjKS4KClBvc3R1cmVzOgogIHJvbGxvdXQ6IG1vcmUgcGVybWlzc2l2ZSBtYXRyaXggZm9y
            IG5ld2x5LW9uYm9hcmRlZCByZXBvcyB3aXRoIGluaGVyaXRlZAogICAgZmluZGluZ3MuIEhpZ2gg
            d2FybnMgb24gZmVhdHVyZSwgTWVkaXVtIHdhcm5zIG9uIG1haW4uCiAgdGFyZ2V0OiBzdHJpY3Qg
            bWF0cml4LiBIaWdoIGJsb2NrcyBvbiBmZWF0dXJlLCBNZWRpdW0gYmxvY2tzIG9uIG1haW4uCgpT
            ZXZlcml0eSBub3JtYWxpemF0aW9uOgogIEVhY2ggc2Nhbm5lcidzIG5hdGl2ZSBzZXZlcml0eSBt
            YXBzIHRvIG9uZSBvZjogY3JpdGljYWwsIGhpZ2gsIG1lZGl1bSwKICBsb3csIGluZm8uIFRyaXZ5
            IFVOS05PV04gbWFwcyB0byBsb3cuIFNBUklGIGBlcnJvci93YXJuaW5nL25vdGVgIG1hcCB0bwog
