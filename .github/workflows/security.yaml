            YmlsaXRpZXMuIFNBUklGIHNsb3RzIHRoZXJlZm9yZSBjYXAKICBhdCBoaWdoOyBjcml0aWNhbCBv
            cmlnaW5hdGVzIG9ubHkgZnJvbSB0cml2eS1wYXJzZWQgc2xvdHMuCgpXYXJuLW9ubHkgc2xvdHM6
            CiAgc2VjcmV0cy1kZXRlY3Rpb24gYW5kIGRvY2tlcmZpbGUtbGludGluZyBuZXZlciBibG9jazog
            YSBtYXRyaXggImJsb2NrIgogIGRvd25ncmFkZXMgdG8gIndhcm4iIGZvciB0aGVtLCBpbmNsdWRp
            bmcgdW5kZXIgZW5mb3JjZS4KCiIiIgoKZnJvbSBfX2Z1dHVyZV9fIGltcG9ydCBhbm5vdGF0aW9u
            cwoKaW1wb3J0IGFyZ3BhcnNlCmltcG9ydCBqc29uCmltcG9ydCBvcwppbXBvcnQgc3lzCmZyb20g
            Y29sbGVjdGlvbnMgaW1wb3J0IENvdW50ZXIKZnJvbSBkYXRhY2xhc3NlcyBpbXBvcnQgZGF0YWNs
